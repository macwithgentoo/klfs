<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLFS - Kinda Linux From Scratch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="chapter-content">
    <p>Loading KLFS documentation...</p>
  </main>

  <script>
    async function loadWelcomeChapter() {
      const container = document.getElementById('chapter-content');

      try {
        // Fetch directly from chapters/1/Welcome
        const response = await fetch('./chapters/1/Welcome');
        
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        let text = await response.text();

        // Format single quotes 'code' into <code> elements
        const formattedText = text.replace(/'([^'\n]+)'/g, '<code>$1</code>');

        // Split double line breaks into paragraphs
        const paragraphs = formattedText
          .split(/\n\s*\n/)
          .filter(p => p.trim() !== '')
          .map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`)
          .join('');

        container.innerHTML = paragraphs;

      } catch (error) {
        container.innerHTML = `<p style="color: red;">Failed to load chapter: ${error.message}</p>`;
      }
    }

    loadWelcomeChapter();
  </script>

</body>
</html>
